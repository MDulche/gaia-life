services:
  app-core:
    image: mcr.microsoft.com/dotnet/sdk:9.0
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - nuget-cache:/root/.nuget/packages
      - /workspace/src/App.Core/bin
      - /workspace/src/App.Core/obj
      - /workspace/src/App.Shared/bin
      - /workspace/src/App.Shared/obj
      - /workspace/src/App.Modules.Finance/bin
      - /workspace/src/App.Modules.Finance/obj
      - /workspace/src/App.Modules.Travail/bin
      - /workspace/src/App.Modules.Travail/obj
      - /workspace/src/App.Modules.Course/bin
      - /workspace/src/App.Modules.Course/obj
      - ./logs:/logs
      - ./backups:/backups
    command: ["dotnet", "watch", "run", "--project", "src/App.Core/App.Core.csproj", "--urls", "http://0.0.0.0:8080"]
    ports:
      - "8080:8080"
    env_file:
      - .env.dev
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:8080
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
      DOTNET_WATCH_SUPPRESS_LAUNCH_BROWSER: "true"
      ConnectionStrings__Default: Server=mariadb;Port=3306;Database=${DB_NAME:-gaia_life};User=gaia;Password=${DB_PASSWORD:-changeme}
      SeedAdmin__Email: ${SEED_ADMIN_EMAIL:-admin@gaia.local}
      SeedAdmin__Password: ${SEED_ADMIN_PASSWORD}
      SeedAdmin__AutoLogin: "true"
      SeedTest__Email: ${SEED_TEST_EMAIL:-test@gaia.local}
      SeedTest__Password: ${SEED_TEST_PASSWORD}
      HealthChecks__LogsPath: /logs
      HealthChecks__BackupsPath: /backups
    depends_on:
      mariadb:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./src
          target: /workspace/src
        - action: rebuild
          path: ./src/App.Core/App.Core.csproj
    networks:
      - gaia

  mariadb:
    image: mariadb:11.6
    env_file:
      - .env.dev
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-changeme_root}
      MARIADB_DATABASE: ${DB_NAME:-gaia_life}
      MARIADB_USER: gaia
      MARIADB_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./backups:/backups
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - gaia

  mariadb-backup:
    build:
      context: .
      dockerfile: docker/mariadb-backup/Dockerfile
    env_file:
      - .env.dev
    environment:
      DB_HOST: mariadb
      DB_NAME: ${DB_NAME:-gaia_life}
      DB_USER: gaia
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      BACKUP_DIR: /backups
      BACKUP_CRON_SCHEDULE: ${BACKUP_CRON_SCHEDULE:-0 3 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/scripts/backup.sh:ro
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - gaia

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app-core
    restart: unless-stopped
    networks:
      - gaia

volumes:
  mariadb_data:
  nuget-cache:

networks:
  gaia:
    driver: bridge
