name: Build

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore GaiaLife.sln

      - name: Build
        run: dotnet build GaiaLife.sln --configuration Release --no-restore

      - name: Test
        run: |
          mapfile -t test_projects < <(find . -name '*.csproj' -print0 | xargs -0 grep -l 'Microsoft.NET.Test.Sdk' || true)
          if [ ${#test_projects[@]} -eq 0 ]; then
            echo "::warning::Aucun projet de test n'existe encore. Étape ignorée."
          else
            dotnet test GaiaLife.sln --configuration Release --no-build --verbosity normal
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          IMAGE="ghcr.io/mdulche/gaia-life"
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${SHORT_SHA}" .
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${SHORT_SHA}"
          echo "Image poussée : ${IMAGE}:latest et ${IMAGE}:${SHORT_SHA}"
