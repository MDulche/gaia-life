<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#66BB6A" />
    <title>Hors ligne — Gaia-Life</title>
    <style>
        html, body {
            margin: 0;
            min-height: 100%;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            background: #ffffff;
            color: #1c1c1c;
        }
        main {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.25rem;
            text-align: center;
        }
        .mark {
            width: 4.5rem;
            height: 4.5rem;
            border-radius: 1rem;
            background: #66BB6A;
            color: #fff;
            font-size: 2.4rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.25rem;
        }
        h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
        p { color: #6c757d; max-width: 28rem; line-height: 1.45; }
        button {
            margin-top: 1rem;
            background: #66BB6A;
            color: #fff;
            border: 0;
            border-radius: 0.375rem;
            padding: 0.55rem 1.1rem;
            font-size: 1rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <div class="mark" aria-hidden="true">G</div>
        <h1>Vous êtes hors ligne</h1>
        <p>
            Gaia-Life a besoin d'une connexion au serveur (Blazor Server).
            Les pages interactives ne peuvent pas fonctionner sans réseau.
            Vérifiez la connexion, puis réessayez.
        </p>
        <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
</body>
</html>
