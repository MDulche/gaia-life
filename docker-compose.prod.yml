services:
  app-core:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.prod
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ConnectionStrings__Default: Server=mariadb;Port=3306;Database=${DB_NAME:-gaia_life};User=gaia;Password=${DB_PASSWORD:-changeme}
    ports:
      - "8080:8080"
    restart: unless-stopped
    volumes:
      - ./backups:/backups
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - gaia

  mariadb:
    image: mariadb:11.6
    env_file:
      - .env.prod
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-changeme_root}
      MARIADB_DATABASE: ${DB_NAME:-gaia_life}
      MARIADB_USER: gaia
      MARIADB_PASSWORD: ${DB_PASSWORD:-changeme}
    restart: unless-stopped
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./backups:/backups
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - gaia

volumes:
  mariadb_data:

networks:
  gaia:
    driver: bridge
