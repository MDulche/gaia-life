services:
  app-core:
    build:
      context: .
      dockerfile: Dockerfile
    image: gaia-life:local
    env_file:
      - .env.prod
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ConnectionStrings__Default: Server=mariadb;Port=3306;Database=${DB_NAME:-gaia_life};User=gaia;Password=${DB_PASSWORD:-changeme}
      HealthChecks__LogsPath: /logs
      HealthChecks__BackupsPath: /backups
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    volumes:
      - ./backups:/backups
      - ./logs:/logs
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - gaia

  mariadb:
    image: mariadb:11.6
    env_file:
      - .env.prod
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-changeme_root}
      MARIADB_DATABASE: ${DB_NAME:-gaia_life}
      MARIADB_USER: gaia
      MARIADB_PASSWORD: ${DB_PASSWORD:-changeme}
    restart: unless-stopped
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./backups:/backups
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - gaia

  mariadb-backup:
    build:
      context: .
      dockerfile: docker/mariadb-backup/Dockerfile
    env_file:
      - .env.prod
    environment:
      DB_HOST: mariadb
      DB_NAME: ${DB_NAME:-gaia_life}
      DB_USER: gaia
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      BACKUP_DIR: /backups
      BACKUP_CRON_SCHEDULE: ${BACKUP_CRON_SCHEDULE:-0 3 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/scripts/backup.sh:ro
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - gaia

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      app-core:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - gaia

volumes:
  mariadb_data:

networks:
  gaia:
    driver: bridge
